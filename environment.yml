name: hvf
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.18
  - libgcc-ng=15.2.0
  - libstdcxx=15.2.0
  - numpy=1.26.4
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - xgboost=3.2.0
  # Required by the figure scripts (scripts/make_fig_*.py, make_case_heatmap.py).
  # A reproduction audit found this missing from the training environment, so the
  # figure scripts would not run there. The pin is the version that actually
  # produced the published figures.
  - matplotlib-base=3.9.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - torch==1.12.1+cu113
      - torchvision==0.13.1+cu113
      - timm==1.0.27
      - Pillow==12.2.0
