  # submitted text gives 12.31% (1,792 / 14,560 cells of the 280-pair dataset) as the share
  # of points dropped; the re-evaluation actually drops 12.6% out-of-fold and 10.6% held-out.
  - file: "results.tex"
    contains: "Floor label rule."
    printed: "12.6"
    source: "neg1_mask_sensitivity.json"
    path: "splits.oof.dropped_pct"
